name: Build IslandDrop APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and find Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          [ -f IslandDrop-source-v1.1.zip ] && ZIP="IslandDrop-source-v1.1.zip"
          [ -z "$ZIP" ] && [ -f IslandDrop-source.zip ] && ZIP="IslandDrop-source.zip"

          if [ -n "$ZIP" ]; then
            mkdir -p android-source
            unzip -oq "$ZIP" -d android-source
          fi

          SETTINGS="$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP không chứa settings.gradle(.kts)."
            [ -n "$ZIP" ] && unzip -l "$ZIP" | head -100
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Align JVM targets
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          for p in root.rglob("*"):
              if p.name not in ("build.gradle", "build.gradle.kts"):
                  continue
              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s
              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = re.sub(
                  r'(?m)(jvmTarget\s*=\s*)"1\.8"',
                  r'\1"17"', s
              )
              if s != old:
                  p.write_text(s)
                  print("Updated JVM target:", p)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslandDrop-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
