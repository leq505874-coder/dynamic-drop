name: Build IslandDrop APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          if [ -f "IslandDrop-source.zip" ]; then
            unzip -o IslandDrop-source.zip -d .
          fi
          test -f settings.gradle.kts || {
            echo "ERROR: Khong tim thay settings.gradle.kts"
            ls -la
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslandDrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
